[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "design-patterns-23"
version = "1.1.0"
description = "GoF 23 design patterns in Python (stdlib demos)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhk0567" }]
keywords = ["design-patterns", "gof", "python", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zhk0567/design-patterns-23"
Repository = "https://github.com/zhk0567/design-patterns-23"

[tool.hatch.build.targets.wheel]
packages = ["patterns"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["patterns", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/learn.py" = ["E501"]
"scripts/generate_cheatsheet.py" = ["E501"]
"scripts/inject_english_docstrings.py" = ["E501"]
"run_all.py" = ["F401"]
"learn.py" = ["F401"]
"test_patterns.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["patterns", "scripts", "examples"]
exclude = ["docs/", ".venv/"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "patterns.*"
disallow_untyped_defs = true
warn_return_any = false
