name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Run smoke tests
        run: python scripts/test_patterns.py

      - name: Run unit tests
        run: python scripts/test_unit_patterns.py

      - name: Run async demo tests
        run: python scripts/test_async_demos.py

      - name: Run ecommerce demo test
        run: python scripts/test_ecommerce_demo.py

      - name: Verify package install
        run: |
          pip install -e .
          python -c "from patterns import load; assert load('01_singleton')"

      - name: Run all demos
        run: python scripts/run_all.py

      - name: Run async demos
        run: python scripts/run_async_demos.py
