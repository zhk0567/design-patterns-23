name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate release assets
        run: |
          python scripts/generate_cheatsheet.py
          python scripts/generate_uml_page.py
          python scripts/export_interview_cards.py

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docs/interview_cards.csv
            docs/UML_ALL.md
            docs/CHEATSHEET.md
